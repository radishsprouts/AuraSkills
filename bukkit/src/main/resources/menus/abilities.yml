title: '{{abilities_title}}'
size: 5
fill:
  enabled: true
  material: black_stained_glass_pane
items:
  back:
    material: arrow
    pos: 4,0
    display_name: '<green>{{back}}'
    lore:
      - '<gray>{{back_click}}'
  equipped_slot_1:
    pos: 0,3
    material: gray_dye
    display_name: '<yellow>装備スロット #1'
  equipped_slot_2:
    pos: 0,4
    material: gray_dye
    display_name: '<yellow>装備スロット #2'
  equipped_slot_3:
    pos: 0,5
    material: gray_dye
    display_name: '<yellow>装備スロット #3'
  preset_manager:
    pos: 0,6
    material: nether_star
    display_name: '<gold><bold>パッシブ一括編成・プリセット管理'
    lore:
      - '<gray>全スキルの解放済みパッシブを1画面で'
      - '<gray>確認・一括編成し、プリセットとして保存できます。'
      - ' '
      - '<yellow>▶ クリックして開く'
  preset_slot_1:
    pos: 4,2
    material: diamond_sword
    display_name: '<aqua>プリセット #1'
  preset_slot_2:
    pos: 4,3
    material: golden_hoe
    display_name: '<aqua>プリセット #2'
  preset_slot_3:
    pos: 4,4
    material: iron_pickaxe
    display_name: '<aqua>プリセット #3'
  preset_slot_4:
    pos: 4,5
    material: iron_axe
    display_name: '<aqua>プリセット #4'
  preset_slot_5:
    pos: 4,6
    material: nether_star
    display_name: '<aqua>プリセット #5'
templates:
  locked_ability:
    material: gray_dye
    display_name: '<aqua>{name}'
    options:
      slots:
        - 1,2
        - 1,3
        - 1,4
        - 1,5
        - 1,6
        - 2,2
        - 2,3
        - 2,4
        - 2,5
    lore:
      - '<white>{{description}}:'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        style: '<gray>'
      - ' '
      - text: '{{unlocked_at}}'
        styles:
          1: '<gray>'
          2: '<dark_aqua>'
      - ' '
      - '<red>{{locked}}'
  unlocked_ability:
    material: light_blue_dye
    display_name: '<aqua>{name}'
    options:
      slots:
        - 1,2
        - 1,3
        - 1,4
        - 1,5
        - 1,6
        - 2,2
        - 2,3
        - 2,4
        - 2,5
    lore:
      - component: your_level
      - component: your_level_maxed
      - ' '
      - component: unlocked_desc
      - component: unlocked_desc_maxed
      - ' '
      - component: equip_status
components:
  equip_status:
    context: Ability
    lore:
      - '{status}'
  your_level:
    context: AbstractAbility
    lore:
      - '<white>{{your_level}}: <aqua>{level}'
  your_level_maxed:
    context: AbstractAbility
    lore:
      - '<white>{{your_level}}: <aqua>{level} <gold>(MAXED)'
  unlocked_desc:
    context: AbstractAbility
    lore:
      - text: '{{next_upgrade_at}}'
        styles:
          1: '<white>'
          2: '<dark_aqua>'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<gray>'
          1: '<yellow>'
  unlocked_desc_maxed:
    context: AbstractAbility
    lore:
      - '<white>{{description}}:'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<gray>'
          1: '<yellow>'
formats:
  desc_upgrade_value: '<gray>{current}<dark_gray>→{next}<gray>'
file_version: 1
