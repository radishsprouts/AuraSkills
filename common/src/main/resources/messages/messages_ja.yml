    desc: "被ダメージ時に15秒間{value}ポイントの追加吸収ハートを展開し、ノックバックを無効化します。"
    info: "{value} 吸収バリア"
  thorns_counter:
    name: "棘の反撃"
    desc: "盾で攻撃を防いだ際、攻撃者に{value}%のダメージを反射し、ノックバックさせて体勢を崩します。"
    info: "{value}% ダメージ反射"
  last_stand:
    name: "ラストスタンド"
    desc: "体力が30%以下に低下した時、受けるダメージが{value}%軽減され、再生効果IIが即座に発動します。"
    info: "{value}% 瀕死時ダメージ軽減"
  fortress_stance:
    name: "要塞の構え"
    desc: "3秒間移動せずその場に留まると構えが完成し、防御力と攻撃力が+{value}%増加します。"
    info: "+{value}% 静止時強化"
  dual_wield:
    name: "二刀流"
    desc: "オフハンドに武器を持った状態で右クリックすると、独立したクールダウンで左手の近接攻撃を繰り出します。"
    info: "+{value}% オフハンド攻撃強化"
  lifesteal_slash:
    name: "吸血刃"
    desc: "モンスターに近接攻撃を当てた際、与えたダメージの{value}%分プレイヤーの体力を即座に吸収回復します。"
    info: "{value}% ダメージ吸収回復"
  cleaving_arc:
    name: "薙ぎ払い撃"
    desc: "剣の薙ぎ払い攻撃の範囲が拡大し、周囲の敵対Mob全員に{value}%の薙ぎ払いダメージを与えます。"
    info: "+{value}% 薙ぎ払いダメージ"
  executioner:
    name: "処刑執行人"
    desc: "体力が40%以下の敵に対する攻撃ダメージが+{value}%上昇し、討伐時に移動速度が瞬間上昇します。"
    info: "+{value}% 処刑ダメージ"
  wind_stepper:
    name: "風歩き"
    desc: "常時プレイヤーの移動速度が+{value}上昇します。"
    info: "+{value} 移動速度"
  evasion:
    name: "直感回避"
    desc: "敵からの直接攻撃や矢を受けた際、{value}%の確率で身を翻してダメージを完全に回避無効化します。"
    info: "{value}% 回避確率"
  acrobat:
    name: "アクロバット"
    desc: "ジャンプ中のクリティカル攻撃ダメージが+{value}%増加し、ダッシュ時の空腹度消費が{value}%軽減されます。"
    info: "+{value}% 跳躍攻撃強化"
  second_wind:
    name: "空中ダッシュ"
    desc: "落下中にスニークを入力すると空中ダッシュを放ち、落下距離をリセットして体勢を立て直します。"
    info: "8秒クールダウン"
  venomous_coat:
    name: "猛毒コーティング"
    desc: "近接攻撃時に敵へ毒薬を塗り込み、{value}秒間毒と移動速度低下効果を付与します。"
    info: "{value}秒 毒・鈍化付与"
  potion_saver:
    name: "調薬節約"
    desc: "ポーションを飲んだ際、{value}%の確率でポーションを消費せず瓶の中身を維持します。"
    info: "{value}% 消費回避確率"
  alchemical_shield:
    name: "錬金結界"
    desc: "自身に発動している有効なポーション効果1種類につき、受けるダメージを{value}%軽減します。"
    info: "1効果につき{value}%軽減"
  volatile_brew:
    name: "揮発性調合"
    desc: "スプラッシュポーション着弾時に錬金衝撃波を放ち、周囲の敵対Mobへ{value}の追加魔法ダメージを与えます。"
    info: "{value} 衝撃波ダメージ"
  arcane_surge:
    name: "秘術解放"
    desc: "手に持った武器に付与されているエンチャントの合計レベル1ごとに、攻撃ダメージが+{value}%増加します。"
    info: "1エンチャントLvごと+{value}%"
  soul_harvester:
    name: "ソウルハーベスター"
    desc: "モンスター討伐時のドロップ経験値が+{value}%増加し、修繕の付いていない装備の耐久値を少し修復します。"
    info: "+{value}% 経験値&装備修復"
  mystic_infusion:
    name: "神秘の注入"
    desc: "エンチャントされた防具を3箇所以上装備している時、すべてのスキル経験値獲得量が+{value}%増加します。"
    info: "+{value}% スキル経験値"
  grindstone_savant:
    name: "砥石の達人"
    desc: "砥石でアイテムのエンチャントを除去した際、{value}%の確率で除去された効果をエンチャント本として回収します。"
    info: "{value}% エンチャント本回収"
